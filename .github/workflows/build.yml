
name: Build and deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate article pages
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import html
          import shutil
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode

          base_url = os.environ["SUPABASE_URL"].rstrip("/")
          api_key = os.environ["SUPABASE_PUBLISHABLE_KEY"]

          if not base_url or not api_key:
              raise RuntimeError("Supabase secrets are missing.")

          query = urlencode({
              "select": "slg,dte,tit,txt,id",
              "order": "dte.desc,id.desc"
          })

          request = Request(
              f"{base_url}/rest/v1/blog?{query}",
              headers={
                  "apikey": api_key,
                  "Accept": "application/json"
              }
          )

          with urlopen(request, timeout=30) as response:
              articles = json.load(response)

          site = Path("_site")
          if site.exists():
              shutil.rmtree(site)
          site.mkdir(parents=True)

          def esc(value):
              return html.escape(str(value or ""), quote=True)

          template = """<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>__TITLE__</title>
            <meta name="description" content="__DESCRIPTION__">
            <style>
              * { box-sizing: border-box; }
              body {
                max-width: 600px;
                margin: 40px auto;
                padding: 0 20px;
                color: #111;
                background: #fff;
                font-family: Georgia, "Times New Roman", serif;
                font-size: 18px;
                line-height: 1.5;
              }
              header {
                margin-bottom: 35px;
                font-size: 16px;
              }
              a {
                color: #111;
                text-decoration: underline;
                text-underline-offset: 2px;
              }
              h1 {
                margin: 0 0 12px;
                font-size: 36px;
                line-height: 1.15;
                font-weight: normal;
                letter-spacing: -0.7px;
              }
              time {
                display: block;
                margin-bottom: 28px;
                color: #666;
                font-size: 15px;
              }
              article p { margin: 0 0 22px; }
              #article-list {
                margin: 0;
                padding-left: 22px;
              }
              #article-list li {
                padding-left: 2px;
                margin-bottom: 8px;
              }
              footer {
                margin-top: 45px;
                padding-bottom: 30px;
                font-size: 15px;
              }
              footer p { margin-bottom: 12px; }
              @media (max-width: 640px) {
                body {
                  margin-top: 24px;
                  font-size: 17px;
                }
                h1 { font-size: 32px; }
              }
            </style>
          </head>
          <body>
            <header><a href="__NAV__">This is test</a></header>
            <main>__MAIN__</main>
            <footer>
              <p>© <a href="__NAV__">This is test</a></p>
            </footer>
          </body>
          </html>
          """

          def render_page(title, description, main, nav):
              return (
                  template
                  .replace("__TITLE__", esc(title))
                  .replace("__DESCRIPTION__", esc(description))
                  .replace("__NAV__", esc(nav))
                  .replace("__MAIN__", main)
              )

          listing = ['<h1>Writing</h1><ul id="article-list">']

          seen = set()

          for article in articles:
              slug = article.get("slg", "")
              title = article.get("tit", "")
              date = article.get("dte", "")
              text = article.get("txt", "")

              if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", slug):
                  raise ValueError(f"Invalid article slug: {slug!r}")

              if slug in seen:
                  raise ValueError(f"Duplicate article slug: {slug}")

              seen.add(slug)

              # Add title to the article index.
              listing.append(
                  f'<li><a href="./{esc(slug)}/">{esc(title)}</a></li>'
              )

              # Convert plain-text paragraphs into HTML.
              paragraphs = re.split(r"\n\s*\n", text.strip())
              paragraphs = [
                  f"<p>{esc(p.strip())}</p>"
                  for p in paragraphs if p.strip()
              ]

              date_html = ""
              if date:
                  date_html = (
                      f'<time datetime="{esc(date)}">'
                      f'{esc(date)}</time>'
                  )

              main = (
                  "<article>"
                  f"<h1>{esc(title)}</h1>"
                  f"{date_html}"
                  f'{"".join(paragraphs)}'
                  "</article>"
              )

              # Generate /slug/index.html.
              article_dir = site / slug
              article_dir.mkdir(parents=True, exist_ok=True)

              (article_dir / "index.html").write_text(
                  render_page(title, text[:160], main, "../"),
                  encoding="utf-8"
              )

          listing.append("</ul>")

          if not articles:
              listing.append("<p>No articles yet.</p>")

          # Generate the main article list.
          (site / "index.html").write_text(
              render_page(
                  "Writing",
                  "Articles and writing.",
                  "".join(listing),
                  "./"
              ),
              encoding="utf-8"
          )

          # Keep the custom domain and disable Jekyll processing.
          (site / "CNAME").write_text("widgt.so\n", encoding="utf-8")
          (site / ".nojekyll").write_text("", encoding="utf-8")

          print(f"Generated {len(articles)} article pages.")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
