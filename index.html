
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Articles</title>
  <meta name="description" content="Articles and writing.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      color: #111;
      background: #fff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.5;
    }

    header {
      margin-bottom: 35px;
      font-size: 16px;
    }

    a {
      color: #111;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 36px;
      line-height: 1.15;
      font-weight: normal;
      letter-spacing: -0.7px;
    }

    #article-list {
      margin: 0;
      padding-left: 22px;
    }

    #article-list li {
      padding-left: 2px;
      margin-bottom: 8px;
    }

    #status {
      color: #666;
      font-size: 15px;
    }

    footer {
      margin-top: 45px;
      padding-bottom: 30px;
      font-size: 15px;
    }

    @media (max-width: 640px) {
      body {
        margin-top: 24px;
        font-size: 17px;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html">This is test</a>
  </header>

  <main>
    <h1>Writing</h1>

    <p id="status" role="status">Loading articles...</p>

    <ul id="article-list"></ul>
  </main>

  <footer>
    <p>© <a href="index.html">This is test</a></p>
  </footer>

  <script>
    // Supabase credentials
    const SUPABASE_URL =
      "https://tvabtksjygxsdiqkoxew.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_9IkYqmbQbxuMnJjS3wsTQw_xn4o-Xfp";

    async function loadArticles() {
      const list = document.getElementById("article-list");
      const status = document.getElementById("status");

      try {
        const url = new URL(
          `${SUPABASE_URL}/rest/v1/blog`
        );

        url.searchParams.set("select", "slg,tit,dte,id");
        url.searchParams.set("order", "dte.desc,id.desc");

        const response = await fetch(url, {
          headers: {
            apikey: SUPABASE_KEY
          }
        });

        if (!response.ok) {
          throw new Error(`Supabase error: ${response.status}`);
        }

        const articles = await response.json();

        list.replaceChildren();

        if (articles.length === 0) {
          status.textContent = "No articles yet.";
          return;
        }

        articles.forEach(article => {
          const item = document.createElement("li");
          const link = document.createElement("a");

          link.href =
            `blog.html?slug=${encodeURIComponent(article.slg)}`;

          link.textContent = article.tit;

          item.appendChild(link);
          list.appendChild(item);
        });

        status.hidden = true;

      } catch (error) {
        console.error(error);
        status.textContent = "Could not load articles.";
      }
    }

    loadArticles();
  </script>
</body>
</html>
